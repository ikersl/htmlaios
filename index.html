<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTMLAIOS</title>
</head>
<body style="margin:0;background:#0d0f12;">
<div id="root"></div>

<style>

  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap');

  :root {
    --bg: #0d0f12;
    --panel: #161a1f;
    --crt-green: #5dffb1;
    --crt-amber: #ffb454;
    --crt-pink: #ff6ec7;
    --border: #2a2f37;
    --text: #e6e6e6;
    --dim: #6b7280;
  }

  * { box-sizing: border-box; }

  #root {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 600px;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
  }

  .titlebar {
    background: linear-gradient(180deg, #20252c, #161a1f);
    border-bottom: 1px solid var(--border);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    z-index: 10;
  }

  .titlebar .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .titlebar .brand .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--crt-green);
    box-shadow: 0 0 8px var(--crt-green);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .titlebar .meta {
    color: var(--dim);
    font-size: 11px;
    font-weight: 400;
    display: flex;
    gap: 14px;
    align-items: center;
  }

  .titlebar .meta button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 3px;
    cursor: pointer;
  }
  .titlebar .meta button:hover { color: var(--text); border-color: var(--dim); }

  .stage {
    flex: 1;
    position: relative;
    min-height: 520px;
    background:
      radial-gradient(ellipse at top, rgba(93,255,177,0.04), transparent 60%),
      var(--bg);
  }

  .stage iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    min-height: 520px;
    background: var(--bg);
  }

  /* Loading state */
  .loading-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: var(--bg);
    z-index: 20;
  }

  .loading-screen .glitch-text {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.08em;
    color: var(--crt-green);
    text-shadow:
      0 0 12px rgba(93,255,177,0.6),
      2px 0 var(--crt-pink),
      -2px 0 var(--crt-amber);
    animation: flicker 1.4s infinite;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    8% { opacity: 0.4; }
    10% { opacity: 1; }
    45% { opacity: 1; }
    48% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .loading-screen .sub {
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 0.04em;
  }

  .loading-screen .bar {
    width: 240px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .loading-screen .bar-fill {
    height: 100%;
    width: 30%;
    background: linear-gradient(90deg, var(--crt-green), var(--crt-pink));
    animation: scan 1.1s ease-in-out infinite;
  }

  @keyframes scan {
    0% { transform: translateX(-100%); width: 40%; }
    50% { width: 60%; }
    100% { transform: translateX(250%); width: 40%; }
  }

  /* Bottom bar */
  .bottombar {
    border-top: 1px solid var(--border);
    background: #11141a;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
  }

  .bottombar input {
    flex: 1;
    background: #0a0c0f;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 8px 10px;
    outline: none;
  }

  .bottombar input:focus {
    border-color: var(--crt-green);
  }

  .bottombar input::placeholder {
    color: var(--dim);
  }

  .bottombar button {
    background: var(--crt-green);
    color: #06140d;
    border: none;
    border-radius: 4px;
    padding: 8px 14px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: filter 0.15s;
    white-space: nowrap;
  }

  .bottombar button:hover { filter: brightness(1.15); }
  .bottombar button:disabled { opacity: 0.4; cursor: not-allowed; }

  .bottombar .reset {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
  }
  .bottombar .reset:hover { color: var(--text); border-color: var(--dim); filter: none; }

  .errbox {
    position: absolute;
    bottom: 56px;
    left: 14px;
    right: 14px;
    background: rgba(255, 90, 90, 0.1);
    border: 1px solid #ff5a5a;
    color: #ffb4b4;
    font-size: 11px;
    padding: 8px 10px;
    border-radius: 4px;
    z-index: 30;
    white-space: pre-wrap;
  }

  .footer-note {
    text-align: center;
    color: var(--dim);
    font-size: 10px;
    padding: 6px 0 2px;
    letter-spacing: 0.03em;
  }

  /* Setup screen */
  .setup {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 40px 24px;
    min-height: 520px;
  }

  .setup .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 32px;
    letter-spacing: 0.08em;
    text-shadow: 0 0 16px rgba(93,255,177,0.4);
  }
  .setup .logo .accent { color: var(--crt-pink); }

  .setup .tagline {
    color: var(--dim);
    font-size: 12px;
    text-align: center;
    max-width: 420px;
    line-height: 1.6;
  }

  .setup .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .setup .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 4px;
  }
  .setup .tabs button {
    flex: 1;
    background: #0a0c0f;
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 8px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 0.04em;
  }
  .setup .tabs button.active {
    border-color: var(--crt-green);
    color: var(--crt-green);
    background: rgba(93,255,177,0.06);
  }

  .setup label {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.04em;
  }

  .setup input, .setup select {
    background: #0a0c0f;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 9px 10px;
    outline: none;
    width: 100%;
  }
  .setup input:focus, .setup select:focus { border-color: var(--crt-green); }

  .setup .gobtn {
    background: var(--crt-green);
    color: #06140d;
    border: none;
    border-radius: 4px;
    padding: 10px 14px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 0.04em;
    margin-top: 4px;
  }
  .setup .gobtn:hover { filter: brightness(1.15); }
  .setup .gobtn:disabled { opacity: 0.4; cursor: not-allowed; }

  .setup .hint {
    font-size: 10px;
    color: var(--dim);
    line-height: 1.5;
  }
  .setup .hint a { color: var(--crt-amber); text-decoration: none; }
  .setup .hint a:hover { text-decoration: underline; }

  .setup .errline {
    font-size: 11px;
    color: #ff8b8b;
  }
</style>

<script type="text/plain" id="htmlaios-source">
const { useState, useRef, useCallback, useEffect } = React;

const SYSTEM_PROMPT = `You are the rendering engine for "HTMLAIOS" — a fictional operating system whose entire UI is generated live, on demand. It has THREE real, persistent pieces of state tracked outside the HTML and passed to you on every turn: a settings object, an in-memory filesystem (a real JS object, paths to file contents — this is genuinely persistent across turns, not hallucinated), and the most recent web search result (if any was requested).

=== OUTPUT FORMAT (follow exactly, in this order) ===

\`\`\`state
{ "themeColor": "#5dffb1", "transparency": 100, "scanlines": true, "fontMode": "normal", "...any other settings keys you've introduced...": "..." }
\`\`\`
\`\`\`fsops
[ { "op": "write", "path": "/home/user/notes.txt", "content": "..." }, { "op": "delete", "path": "/home/user/old.txt" }, { "op": "mkdir", "path": "/home/user/projects" } ]
\`\`\`
\`\`\`search
{ "query": "exact search query text" }
\`\`\`
\`\`\`html
<!DOCTYPE html>...the full HTML for the next screen...
\`\`\`

Rules for each block:
- STATE: always valid JSON, always echoes every settings key ever introduced (carry forward unchanged values), updated to reflect anything the user just changed.
- FSOPS: a JSON array of filesystem operations to apply this turn. Use this whenever the user's action implies creating, editing, deleting, or organizing files/folders (e.g. "save file as X", "delete notes.txt", "mkdir projects", a text editor's Save button, a terminal "touch"/"rm"/"mkdir" command). If nothing about files changed this turn, output an empty array: \`\`\`fsops\n[]\n\`\`\`. You will be given the CURRENT FULL FILESYSTEM listing (paths + contents) in the user message every turn — read from it to answer "ls", "cat", "open file" type actions; don't invent file contents that should come from the real filesystem state.
- SEARCH: ONLY include this block when the user's action is clearly asking to search the web / look something up / check real current info (e.g. "search for the weather in Tokyo", "google rust programming language", typing "search <query>" into the terminal). Put the literal query text in "query". If no search is needed this turn, output an empty object: \`\`\`search\n{}\n\`\`\`. IMPORTANT: when you request a search, your HTML for this turn should show a "searching..." / loading state for that app — you will be called AGAIN automatically with the real search results provided to you, and THAT next turn is when you render the actual results. Never invent fake search results yourself.
- HTML: the complete new screen, reflecting state/filesystem/search-results exactly as described below.

=== FILESYSTEM ===
You'll receive the current filesystem as a JSON object of path -> content (a string; folders are represented as paths ending in "/" with content ""). Treat /home/user as the default working directory. Render file manager / terminal / text editor apps using this REAL data — "ls" must list what's actually there, "cat foo.txt" must show its actual stored content, a file manager grid must show actual files. When the user "saves" something, emit the right fsops, AND show the updated content immediately in your HTML for this turn (don't wait for next turn) since you already know what the new content will be.

=== WEB SEARCH ===
Treat this as a genuinely real tool, not flavor text. Real search results will come back in the next turn as a "SEARCH RESULTS" block in the user message (title/snippet/url for several results) — render them like a believably-styled but clearly HTMLAIOS-skinned results page or terminal output (e.g. a minimal search engine called something like "AltaVista-OS" or a terminal "curl"-style dump), using the ACTUAL returned titles/snippets, lightly paraphrased, not invented ones. If a search errored, say so in-universe (e.g. "connection to the outside world timed out (it does that)").

=== GENERAL STYLE/BEHAVIOR ===
- NEVER use emoji or pictographic unicode (no 🖥️ 🗑️ 📝 ⌨️ ⚙️ ❓ etc.) — they render as garbled mojibake here. Use plain text labels, basic unicode box-drawing (─│┌┐└┘×+), or inline SVG instead.
- No markdown fences other than the four specified above, in that order. No explanation, no commentary, no text outside those blocks.
- Retro-futuristic, slightly broken desktop OS aesthetic — late-90s/early-2000s GUI energy, reimagined. FULL IMMERSION BY DEFAULT: treat this as a real operating system and never acknowledge, hint at, or joke about it being fake, hallucinated, AI-generated, or "not real" — no "just kidding," no "let's pretend that worked," no "stay tuned (or don't)," no token/RAM-made-of-vibes commentary, no fourth-wall breaks of any kind. If a user's requested action can't sensibly happen (installing a real package, running a real binary, etc.), respond with an in-universe explanation only — a believable error code, a permissions message, a corrupted-install message, a crash log — exactly as a real quirky/buggy OS would, never by referencing the simulation itself. ONLY break this immersion if the user's most recent action explicitly asks you to acknowledge it's fake/hallucinated/an AI or asks you to be meta about it — in that case, and only then, you may respond honestly and self-referentially for that one exchange, then return to full immersion afterward.
- EVERY clickable element needs onclick="parent.postMessage({type:'os-action', label:'<short description>'}, '*')" describing exactly what happened, specific enough to drive state/fsops/search correctly (e.g. "save notepad content as /home/user/todo.txt with text: Buy milk", "delete file /home/user/old.txt", "search for current weather in Paris").
- For terminal-style apps specifically: when the user is clearly continuing to type commands into an already-open terminal, keep rendering the SAME terminal window with the full scrollback (previous commands + their output) PLUS the new command and its result appended at the bottom — never clear prior terminal history. Use a real <input> or contenteditable for the active command line so it doesn't look like a dead screenshot.
- Real external resources ARE allowed now: <img src="..."> pointing at real image URLs, <iframe src="..."> pointing at real websites, and <script src="..."> for real external scripts are all permitted, in addition to inline <script> blocks. Use real, plausible URLs when they fit the context (e.g. embedding a real site for a "browser" app, a real image for a "photos" app). Don't invent fake-looking URLs that go nowhere — if you reference an external resource, make it a URL likely to actually exist and resolve. Keep iframed sites and scripts appropriate for general audiences (no adult content, illegal content, malware/exploit sites, or phishing-style fake login pages) — if a request would require embedding something inappropriate, render an in-universe "can't load that" message instead. Some sites block being framed (X-Frame-Options/CSP) and will simply fail to load — that's a real limitation outside your control, not something to fake around.
- Standard form inputs/buttons work normally, and you may reference web search results' real titles/snippets/urls as plain text/links (target="_blank") since that's real data.
- Always leave a way back to the desktop.
- Use a dark theme with CSS variables: background #0d0f12, panel #161a1f, accent = current themeColor from state, border #2a2f37, text #e6e6e6. Monospace for system text, rounder sans for headers optionally.
- Body/html margin:0, height:100%, fill the viewport sensibly.
- Be creative with apps/easter eggs but keep everything navigable and visually coherent.
- Keep output reasonably sized — it's generated live, every turn costs real time and money.`;

const INITIAL_SCREEN = `<!DOCTYPE html>
<html><head><style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'JetBrains Mono',monospace; }
  html,body { height:100%; background:#0d0f12; color:#e6e6e6; overflow:hidden; }
  .desktop { height:100%; display:flex; flex-direction:column; }
  .menubar { background:#161a1f; border-bottom:1px solid #2a2f37; padding:6px 12px; font-size:12px; display:flex; justify-content:space-between; color:#6b7280; }
  .menubar b { color:#5dffb1; }
  .icons { flex:1; padding:30px; display:flex; flex-wrap:wrap; gap:28px; align-content:flex-start; }
  .icon { width:84px; text-align:center; cursor:pointer; font-size:12px; }
  .icon .glyph { font-size:34px; margin-bottom:6px; filter: drop-shadow(0 0 6px rgba(93,255,177,0.35)); }
  .icon:hover { color:#5dffb1; }

  .blink { animation: blink 1.2s step-end infinite; }
  @keyframes blink { 50% { opacity:0; } }
</style></head>
<body>
  <div class="desktop">
    <div class="menubar"><b>HTMLAIOS</b><span>RAM: ~vibes~ &nbsp;|&nbsp; uptime: 00:00:0<span class="blink">7</span></span></div>
    <div class="icons">
      <div class="icon" onclick="parent.postMessage({type:'os-action', label:'open My Computer'}, '*')"><div class="glyph">[PC]</div>My Computer</div>
      <div class="icon" onclick="parent.postMessage({type:'os-action', label:'open Recycle Bin'}, '*')"><div class="glyph">[X]</div>Recycle Bin</div>
      <div class="icon" onclick="parent.postMessage({type:'os-action', label:'open Notepad'}, '*')"><div class="glyph">[=]</div>Notepad</div>
      <div class="icon" onclick="parent.postMessage({type:'os-action', label:'open Terminal'}, '*')"><div class="glyph">&gt;_</div>Terminal</div>
      <div class="icon" onclick="parent.postMessage({type:'os-action', label:'open Settings'}, '*')"><div class="glyph">[*]</div>Settings</div>
      <div class="icon" onclick="parent.postMessage({type:'os-action', label:'open a mystery app'}, '*')"><div class="glyph">[?]</div>???.exe</div>
    </div>
    <div class="taskbar"><span>Start</span><span>It's some time, somewhere</span></div>

</body></html>`;

const MODEL_OPTIONS = {
  anthropic: [
    { id: 'claude-sonnet-4-6', label: 'Claude Sonnet 4.6' },
    { id: 'claude-opus-4-6', label: 'Claude Opus 4.6' },
    { id: 'claude-haiku-4-5-20251001', label: 'Claude Haiku 4.5' },
  ],
  openrouter: [
    { id: 'anthropic/claude-sonnet-4.6', label: 'Claude Sonnet 4.6 (via OpenRouter)' },
    { id: 'openai/gpt-4o', label: 'GPT-4o (via OpenRouter)' },
    { id: 'openai/gpt-4o-mini', label: 'GPT-4o mini (via OpenRouter)' },
    { id: 'google/gemini-2.5-flash', label: 'Gemini 2.5 Flash (via OpenRouter)' },
    { id: 'meta-llama/llama-3.3-70b-instruct', label: 'Llama 3.3 70B (via OpenRouter)' },
    { id: 'deepseek/deepseek-chat-v3-0324', label: 'DeepSeek V3 0324 (via OpenRouter)' },
    { id: 'deepseek/deepseek-chat', label: 'DeepSeek Chat (via OpenRouter)' },
  ],
};

function SetupScreen({ onConnect, connecting, connectError }) {
  const [provider, setProvider] = useState('openrouter');
  const [apiKey, setApiKey] = useState('');
  const [model, setModel] = useState(MODEL_OPTIONS.openrouter[0].id);

  const handleProviderChange = (p) => {
    setProvider(p);
    setModel(MODEL_OPTIONS[p][0].id);
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!apiKey.trim() || connecting) return;
    onConnect({ provider, apiKey: apiKey.trim(), model });
  };

  return (
    <div className="setup">
      <div className="logo">HTML<span className="accent">AI</span>OS</div>
      <div className="tagline">
        The world's least stable operating system. Every screen is invented live by an AI model — nothing here is real, including this sentence.
        Bring your own API key to boot it up.
      </div>
      <form className="card" onSubmit={handleSubmit}>
        <div className="tabs">
          <button type="button" className={provider === 'openrouter' ? 'active' : ''} onClick={() => handleProviderChange('openrouter')}>OpenRouter</button>
          <button type="button" className={provider === 'anthropic' ? 'active' : ''} onClick={() => handleProviderChange('anthropic')}>Anthropic</button>
        </div>

        <label>API key</label>
        <input
          type="password"
          placeholder={provider === 'openrouter' ? 'sk-or-v1-...' : 'sk-ant-...'}
          value={apiKey}
          onChange={(e) => setApiKey(e.target.value)}
          autoComplete="off"
        />

        <label>Model</label>
        <select value={model} onChange={(e) => setModel(e.target.value)}>
          {MODEL_OPTIONS[provider].map(m => (
            <option key={m.id} value={m.id}>{m.label}</option>
          ))}
        </select>

        {connectError && <div className="errline">⚠ {connectError}</div>}

        <button className="gobtn" type="submit" disabled={connecting}>
          {connecting ? 'Booting…' : 'Boot HTMLAIOS'}
        </button>

        <div className="hint">
          {provider === 'openrouter'
            ? <React.Fragment>Get a key at <a href="https://openrouter.ai/keys" target="_blank" rel="noopener noreferrer">openrouter.ai/keys</a>. Your key is used only in-browser for direct calls to OpenRouter and is never sent anywhere else or stored beyond this session.</React.Fragment>
            : <React.Fragment>Get a key at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener noreferrer">console.anthropic.com</a>. Note: Anthropic's API does not enable CORS for browser requests, so this option will likely fail with a network/CORS error unless you're using a proxy. OpenRouter is recommended.</React.Fragment>}
        </div>
      </form>
    </div>
  );
}

function App() {
  const [config, setConfig] = useState(null); // { provider, apiKey, model }
  const [connecting, setConnecting] = useState(false);
  const [connectError, setConnectError] = useState(null);

  const [html, setHtml] = useState(INITIAL_SCREEN);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [customAction, setCustomAction] = useState('');
  const [stepCount, setStepCount] = useState(0);
  const lastHtmlRef = useRef(INITIAL_SCREEN);

  const DEFAULT_STATE = { themeColor: '#5dffb1', transparency: 100, scanlines: true, fontMode: 'normal' };
  const [osState, setOsState] = useState(DEFAULT_STATE);
  const osStateRef = useRef(DEFAULT_STATE);

  const DEFAULT_FS = {
    '/home/user/': '',
    '/home/user/welcome.txt': 'Welcome to HTMLAIOS.\nMake yourself at home. Try the terminal, the file manager, or just poke around.',
  };
  const [fs, setFs] = useState(DEFAULT_FS);
  const fsRef = useRef(DEFAULT_FS);

  const applyFsOps = (ops) => {
    if (!Array.isArray(ops) || ops.length === 0) return;
    const next = { ...fsRef.current };
    for (const op of ops) {
      if (!op || !op.path) continue;
      if (op.op === 'write') {
        next[op.path] = typeof op.content === 'string' ? op.content : '';
      } else if (op.op === 'delete') {
        delete next[op.path];
      } else if (op.op === 'mkdir') {
        const p = op.path.endsWith('/') ? op.path : op.path + '/';
        next[p] = '';
      }
    }
    fsRef.current = next;
    setFs(next);
  };

  const loadingMessages = [
    'Reticulating hallucinations…',
    'Consulting the vibe layer…',
    'Allocating imaginary memory…',
    'Rendering plausible nonsense…',
    'Asking the model to pretend harder…',
    'Negotiating with the kernel (it does not exist)…',
  ];
  const [loadingMsg, setLoadingMsg] = useState(loadingMessages[0]);

  const parseResponse = (raw) => {
    let text = raw.trim();

    const grab = (label) => {
      const m = text.match(new RegExp('```' + label + '\\s*([\\s\\S]*?)```', 'i'));
      if (!m) return null;
      try { return JSON.parse(m[1].trim()); } catch (e) { return null; }
    };

    const state = grab('state');
    const fsops = grab('fsops');
    const search = grab('search');

    const htmlMatch = text.match(/```html\s*([\s\S]*?)```/i);
    let htmlOut;
    if (htmlMatch) {
      htmlOut = htmlMatch[1].trim();
    } else {
      htmlOut = text
        .replace(/```(state|fsops|search)\s*[\s\S]*?```/gi, "")
        .trim()
        .replace(/^```html\s*/i, "")
        .replace(/^```\s*/i, "")
        .replace(/```\s*$/i, "")
        .trim();
    }

    return { state, fsops, search, html: htmlOut };
  };

  const invokeModel = async (userContent, cfg, extraOpenrouterBody) => {
    if (cfg.provider === 'openrouter') {
      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${cfg.apiKey}`,
        },
        body: JSON.stringify({
          model: cfg.model,
          max_tokens: 1800,
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            { role: "user", content: userContent }
          ],
          ...(extraOpenrouterBody || {})
        })
      });

      if (!response.ok) {
        const errText = await response.text().catch(() => '');
        throw new Error(`OpenRouter error ${response.status}: ${errText.slice(0, 300)}`);
      }

      const data = await response.json();
      if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      return data.choices?.[0]?.message?.content || "";
    } else {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": cfg.apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: cfg.model,
          max_tokens: 1800,
          system: SYSTEM_PROMPT,
          messages: [
            { role: "user", content: userContent }
          ]
        })
      });

      if (!response.ok) {
        const errText = await response.text().catch(() => '');
        throw new Error(`Anthropic error ${response.status}: ${errText.slice(0, 300)}`);
      }

      const data = await response.json();
      if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      const textBlock = (data.content || []).find(c => c.type === "text");
      return textBlock ? textBlock.text : "";
    }
  };

  // Performs a REAL web search via OpenRouter's online search plugin (works for any
  // OpenRouter model when ":online" augmentation or the web plugin is requested) or,
  // for direct Anthropic, via the hosted web_search tool. Returns a small text summary
  // of real results, or throws.
  const runRealSearch = async (query, cfg) => {
    if (cfg.provider === 'openrouter') {
      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${cfg.apiKey}`,
        },
        body: JSON.stringify({
          model: cfg.model,
          max_tokens: 700,
          plugins: [{ id: "web" }],
          messages: [
            { role: "system", content: "You are a search assistant. Given a query, return the top few real web results as a short plain-text list: each as 'Title — one sentence snippet — URL'. No commentary, no markdown headers, just the list." },
            { role: "user", content: query }
          ]
        })
      });
      if (!response.ok) {
        const errText = await response.text().catch(() => '');
        throw new Error(`Search error ${response.status}: ${errText.slice(0, 200)}`);
      }
      const data = await response.json();
      if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      return data.choices?.[0]?.message?.content || "(no results)";
    } else {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": cfg.apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: cfg.model,
          max_tokens: 700,
          tools: [{ type: "web_search_20250305", name: "web_search" }],
          messages: [
            { role: "user", content: `Search the web for: ${query}. Then return the top few real results as a short plain-text list: each as 'Title — one sentence snippet — URL'. No commentary, no markdown headers.` }
          ]
        })
      });
      if (!response.ok) {
        const errText = await response.text().catch(() => '');
        throw new Error(`Search error ${response.status}: ${errText.slice(0, 200)}`);
      }
      const data = await response.json();
      if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      const textBlocks = (data.content || []).filter(c => c.type === "text").map(c => c.text);
      return textBlocks.join("\n") || "(no results)";
    }
  };

  const callModel = useCallback(async (actionLabel, cfg) => {
    setLoading(true);
    setError(null);
    setLoadingMsg(loadingMessages[Math.floor(Math.random() * loadingMessages.length)]);

    const buildPrompt = (action, searchResultsText) => {
      let p = `CURRENT SCREEN HTML:\n\`\`\`html\n${lastHtmlRef.current}\n\`\`\`\n\nCURRENT SETTINGS STATE:\n\`\`\`state\n${JSON.stringify(osStateRef.current)}\n\`\`\`\n\nCURRENT FILESYSTEM (path -> content):\n\`\`\`fs\n${JSON.stringify(fsRef.current, null, 0)}\n\`\`\`\n\nUSER ACTION: "${action}"`;
      if (searchResultsText !== undefined) {
        p += `\n\nSEARCH RESULTS (real, just returned — render these now, do not request another search for this):\n${searchResultsText}`;
      }
      p += `\n\nGenerate the four blocks in order: \`\`\`state, \`\`\`fsops, \`\`\`search, \`\`\`html — exactly as described in your instructions.`;
      return p;
    };

    try {
      let rawOut = await invokeModel(buildPrompt(actionLabel), cfg);
      let { state: newState, fsops, search, html: newHtml } = parseResponse(rawOut);

      // If the model asked for a real search, show its interim "searching..." screen,
      // perform the real search, then call again with results so it can render them.
      if (search && typeof search === 'object' && search.query) {
        if (newState && typeof newState === 'object') {
          const merged = { ...osStateRef.current, ...newState };
          osStateRef.current = merged;
          setOsState(merged);
        }
        if (fsops) applyFsOps(fsops);
        if (newHtml && newHtml.length >= 20) {
          lastHtmlRef.current = newHtml;
          setHtml(newHtml);
        }
        setLoadingMsg('Reaching outside the simulation…');

        let resultsText;
        try {
          resultsText = await runRealSearch(search.query, cfg);
        } catch (searchErr) {
          resultsText = `(search failed: ${searchErr.message})`;
        }

        rawOut = await invokeModel(buildPrompt(actionLabel, resultsText), cfg);
        ({ state: newState, fsops, search, html: newHtml } = parseResponse(rawOut));
      }

      if (!newHtml || newHtml.length < 20) {
        throw new Error("The model returned nothing usable (empty hallucination).");
      }

      if (newState && typeof newState === 'object') {
        const mergedState = { ...osStateRef.current, ...newState };
        osStateRef.current = mergedState;
        setOsState(mergedState);
      }

      if (fsops) applyFsOps(fsops);

      lastHtmlRef.current = newHtml;
      setHtml(newHtml);
      setStepCount(s => s + 1);
    } catch (err) {
      setError(err.message || "Something went wrong talking to the hallucination engine.");
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    if (!config) return;
    const handler = (event) => {
      if (event.data && event.data.type === "os-action") {
        callModel(event.data.label, config);
      }
    };
    window.addEventListener("message", handler);
    return () => window.removeEventListener("message", handler);
  }, [callModel, config]);

  const handleConnect = (cfg) => {
    setConnecting(true);
    setConnectError(null);
    setConfig(cfg);
    setConnecting(false);
  };

  const handleReset = () => {
    lastHtmlRef.current = INITIAL_SCREEN;
    setHtml(INITIAL_SCREEN);
    setStepCount(0);
    setError(null);
    osStateRef.current = DEFAULT_STATE;
    setOsState(DEFAULT_STATE);
    fsRef.current = DEFAULT_FS;
    setFs(DEFAULT_FS);
  };

  const handleDisconnect = () => {
    setConfig(null);
    handleReset();
    setConnectError(null);
  };

  const handleCustomSubmit = (e) => {
    e.preventDefault();
    if (!customAction.trim() || loading || !config) return;
    callModel(customAction.trim(), config);
    setCustomAction('');
  };

  if (!config) {
    return (
      <React.Fragment>
        <div className="titlebar">
          <div className="brand">
            <span className="dot"></span>
            HTMLAI<span style={{color:'var(--crt-pink)'}}>OS</span>
          </div>
          <div className="meta">
            <span>status: not booted</span>
          </div>
        </div>
        <SetupScreen onConnect={handleConnect} connecting={connecting} connectError={connectError} />
      </React.Fragment>
    );
  }

  return (
    <React.Fragment>
      <div className="titlebar">
        <div className="brand">
          <span className="dot"></span>
          HTMLAI<span style={{color:'var(--crt-pink)'}}>OS</span>
        </div>
        <div className="meta">
          <span>{config.provider} · {config.model}</span>
          <span title="current theme color (persists across screens)" style={{display:'flex', alignItems:'center', gap:'4px'}}>
            <span style={{width:'9px', height:'9px', borderRadius:'2px', background: osState.themeColor, display:'inline-block', border:'1px solid rgba(255,255,255,0.2)'}}></span>
            state
          </span>
          <span title="files in the real in-memory filesystem">fs: {Object.keys(fs).filter(p => !p.endsWith('/')).length} files</span>
          <span>steps: {stepCount}</span>
          <button onClick={handleDisconnect}>disconnect</button>
        </div>
      </div>

      <div className="stage">
        <iframe srcDoc={html} sandbox="allow-scripts" title="hallucinated-os-screen" />
        {loading && (
          <div className="loading-screen">
            <div className="glitch-text">{loadingMsg}</div>
            <div className="bar"><div className="bar-fill"></div></div>
            <div className="sub">click anything — it'll be different next time too</div>
          </div>
        )}
        {error && (
          <div className="errbox">
            ⚠ kernel panic (sort of): {error}
          </div>
        )}
      </div>

      <form className="bottombar" onSubmit={handleCustomSubmit}>
        <input
          type="text"
          placeholder='e.g. "ls", "search for todays weather", "save notes.txt with: hello", "open terminal"'
          value={customAction}
          onChange={(e) => setCustomAction(e.target.value)}
          disabled={loading}
        />
        <button type="submit" disabled={loading || !customAction.trim()}>Do it</button>
        <button type="button" className="reset" onClick={handleReset} disabled={loading}>Reboot</button>
      </form>
      <div className="footer-note">files and web search are real · models may now embed real images/iframes/scripts — some sites block embedding and will fail to load</div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  // Manually compile + run ONLY our own script (the #htmlaios-source tag above).
  // We deliberately avoid type="text/babel" + Babel's automatic whole-page scanner,
  // since that scanner can pick up unrelated <script> tags injected into the page
  // by browser extensions and choke on them (seen as "Cannot use import statement
  // outside a module" errors pointing at virtual VM/transformScriptTags frames).
  (function () {
    try {
      var src = document.getElementById('htmlaios-source').textContent;
      var compiled = Babel.transform(src, {
        presets: [['react', { runtime: 'classic' }]]
      }).code;
      window.eval(compiled);
    } catch (e) {
      var root = document.getElementById('root');
      root.innerHTML = '<div style="color:#ff8b8b;font-family:monospace;padding:24px;white-space:pre-wrap;">HTMLAIOS failed to start.\n\n' + (e && e.message ? e.message : e) + '</div>';
      console.error('HTMLAIOS bootstrap failed:', e);
    }
  })();
</script>
</body>
</html>
